<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock Paper Scissors</title>

  <style>
    body {
      background-color: rgb(25, 25, 25);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .title {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .emoji-btn {
      height: 130px;
      width: 130px;
      font-size: 50px;
      margin: 10px;
      cursor: point er;
      border-radius: 50%;
      border: none;
      background: linear-gradient(
        90deg,
        rgb(246, 246, 3),
        rgb(171, 7, 247),
        rgb(3, 185, 245)
      );
      transition: transform 0.2s ease;
    }

    .emoji-btn:hover {
      transform: scale(1.1);
    }

    .reset-btn {
      font-size: 18px;
      padding: 10px 25px;
      cursor: pointer;
      border-radius: 20px;
      margin-top: 20px;
      background: linear-gradient(90deg, blue, rgb(39, 3, 45), rgb(36, 1, 32));
      color: white;
      border: 2px solid white;
      transition: transform 0.2s ease;
    }

    .reset-btn:hover {
      transform: scale(1.1);
    }

    .js-result {
      font-weight: bold;
      font-size: 24px;
      margin: 20px auto;
      width: fit-content;
      background: linear-gradient(
        90deg,
        white,
        rgb(242, 60, 5),
        rgb(238, 218, 5)
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .js-moves,
    .js-score {
      font-size: 18px;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <p class="title">Rock Paper Scissors</p>

  <button class="emoji-btn" onclick="playGame('Rock')">✊</button>
  <button class="emoji-btn" onclick="playGame('Paper')">✋</button>
  <button class="emoji-btn" onclick="playGame('Scissors')">✌️</button>

  <p class="js-result"></p>
  <p class="js-moves"></p>
  <p class="js-score"></p>

  <button class="reset-btn" onclick="resetScore()">Reset Score</button>

  <script>
    let score = JSON.parse(localStorage.getItem("score")) || {
      wins: 0,
      losses: 0,
      ties: 0
    };

    updateScore();

    function playGame(playerMove) {
      const randomNumber = Math.random();
      let computerMove = "";

      if (randomNumber < 1 / 3) {
        computerMove = "Rock";
      } else if (randomNumber < 2 / 3) {
        computerMove = "Paper";
      } else {
        computerMove = "Scissors";
      }

      let result = "";

      if (playerMove === computerMove) {
        result = "Tie";
        score.ties++;
      } else if (
        (playerMove === "Rock" && computerMove === "Scissors") ||
        (playerMove === "Paper" && computerMove === "Rock") ||
        (playerMove === "Scissors" && computerMove === "Paper")
      ) {
        result = "You Win";
        score.wins++;
      } else {
        result = "You Lose";
        score.losses++;
      }

      localStorage.setItem("score", JSON.stringify(score));

      document.querySelector(".js-result").innerHTML = result;
      document.querySelector(".js-moves").innerHTML =
        `You chose <b>${playerMove}</b> — Computer chose <b>${computerMove}</b>`;

      updateScore();
    }

    function updateScore() {
      document.querySelector(".js-score").innerHTML =
        `Wins: ${score.wins} | Losses: ${score.losses} | Ties: ${score.ties}`;
    }

    function resetScore() {
      score = { wins: 0, losses: 0, ties: 0 };
      localStorage.removeItem("score");
      document.querySelector(".js-result").innerHTML = "";
      document.querySelector(".js-moves").innerHTML = "";
      updateScore();
    }
  </script>
</body>
</html>
